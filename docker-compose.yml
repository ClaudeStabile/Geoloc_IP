version: '3.8'

services:
  ip-tracker:
    build: .
    container_name: ip-geo-tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Volume pour vos logs serveur (lecture seule)
      - /var/log/nginx:/logs:ro
      # Volume pour la base de données MaxMind locale (lecture seule)
      - ./data:/data:ro
    environment:
      - LOG_FILE=/logs/access.log
      - GEOIP_DB_PATH=data/GeoLite2-City_20261113/GeoLite2-City.mmdb
