<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Live IP Geolocation Tracker (Nginx + HAProxy)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #14171a;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        #info-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 360px;
            max-height: calc(100% - 24px);
            overflow-y: auto;
            background: rgba(20, 23, 26, 0.92);
            color: #f1f3f5;
            padding: 14px 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            z-index: 1000;
            font-size: 13px;
        }
        #urls-panel {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: 420px;
            max-width: calc(100% - 24px);
            background: rgba(20, 23, 26, 0.92);
            color: #f1f3f5;
            padding: 12px 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            z-index: 1000;
            font-size: 13px;
        }
        .total-box {
            font-size: 15px;
            margin-bottom: 8px;
        }
        .sources-bar {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #ced4da;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .window-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 12px;
            color: #ced4da;
        }
        .window-row select {
            background: #2b3035;
            color: #f1f3f5;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 12px;
        }
        .dot-nginx { color: #ff7875; font-weight: 700; }
        .dot-haproxy { color: #51cf66; font-weight: 700; }
        h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #adb5bd;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 5px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            vertical-align: top;
        }
        th {
            color: #868e96;
            font-weight: 600;
            font-size: 11px;
        }
        .ip-cell {
            font-family: monospace;
            color: #74c0fc;
        }
        .host-cell {
            color: #ced4da;
            font-size: 11px;
            word-break: break-all;
        }
        .url-cell {
            font-family: monospace;
            color: #ff8787;
            font-size: 12px;
            word-break: break-all;
        }
        .backend-cell {
            font-family: monospace;
            color: #51cf66;
            font-size: 12px;
            word-break: break-all;
        }
        .count-cell {
            text-align: right;
            font-weight: 700;
            color: #f1f3f5;
            white-space: nowrap;
            padding-left: 8px;
        }
    </style>
</head>
<body>
    <div id="info-panel">
        <div class="total-box">
            <b>Connexions en direct :</b> <span id="count">0</span>
        </div>
        <div class="sources-bar">
            <span><span class="dot-nginx">●</span> Nginx: <b id="src-nginx">0</b></span>
            <span><span class="dot-haproxy">●</span> HAProxy: <b id="src-haproxy">0</b></span>
        </div>
        <div class="window-row">
            <label for="window-select"><b>Fenêtre Top 10 IP :</b></label>
            <select id="window-select">
                <option value="900">15 minutes</option>
                <option value="3600" selected>1 heure</option>
                <option value="21600">6 heures</option>
                <option value="86400">24 heures</option>
            </select>
        </div>
        <h3>Top 10 IP (<span id="window-label">1h</span>)</h3>
        <table>
            <thead>
                <tr>
                    <th>IP / Hôte</th>
                    <th style="text-align: right;">Hits</th>
                </tr>
            </thead>
            <tbody id="top-ips-body">
                <tr><td colspan="2" style="color:#868e96;">En attente de trafic...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="urls-panel">
        <h3>Top 5 URL / Backends actifs</h3>
        <table>
            <thead>
                <tr>
                    <th>URL (Nginx) / Backend (HAProxy)</th>
                    <th style="text-align: right;">Connexions</th>
                </tr>
            </thead>
            <tbody id="top-targets-body">
                <tr><td colspan="2" style="color:#868e96;">En attente de trafic...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const map = L.map("map", { worldCopyJump: true }).setView([20, 0], 2);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const BASE_RADIUS = 6;
        const MAX_SCALE_RATIO = 4;

        const markers = [];
        const markersByIp = new Map();
        let totalCount = 0;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function formatWindowLabel(sec) {
            const s = Number(sec) || 3600;
            if (s % 3600 === 0) return `${s / 3600}h`;
            if (s % 60 === 0) return `${s / 60}m`;
            return `${s}s`;
        }

        function syncWindowSelect(sec) {
            const select = document.getElementById("window-select");
            const val = String(sec);
            let opt = Array.from(select.options).find(o => o.value === val);
            if (!opt) {
                opt = document.createElement("option");
                opt.value = val;
                opt.textContent = formatWindowLabel(sec);
                select.appendChild(opt);
            }
            select.value = val;
            document.getElementById("window-label").innerText = formatWindowLabel(sec);
        }

        function computeRadius(ipCount) {
            const hits = Math.max(1, Number(ipCount) || 1);
            const ratio = Math.min(MAX_SCALE_RATIO, 1 + Math.log2(hits) * 0.75);
            return BASE_RADIUS * ratio;
        }

        function addMarker(data) {
            totalCount++;
            document.getElementById("count").innerText = totalCount;

            const isHaproxy = data.source === "haproxy";
            const ipCount = data.ip_count || 1;
            const radius = computeRadius(ipCount);

            const existingForIp = markersByIp.get(data.ip) || [];
            for (const oldM of existingForIp) {
                oldM.setRadius(radius);
            }

            const marker = L.circleMarker([data.lat, data.lon], {
                radius: radius,
                color: isHaproxy ? "#2f9e44" : "#ff4d4f",
                weight: 2,
                fillColor: isHaproxy ? "#51cf66" : "#ff7875",
                fillOpacity: 0.8
            }).addTo(map);

            marker.bindPopup(
                `<b>Source :</b> ${escapeHtml((data.source || "nginx").toUpperCase())}<br>` +
                `<b>IP :</b> ${escapeHtml(data.ip)} (${ipCount} hits)<br>` +
                `<b>Hôte :</b> ${escapeHtml(data.hostname)}<br>` +
                `<b>Cible :</b> ${escapeHtml(data.target || "—")}<br>` +
                `<b>Lieu :</b> ${escapeHtml(data.city)}, ${escapeHtml(data.country)}`
            );

            existingForIp.push(marker);
            markersByIp.set(data.ip, existingForIp);
            markers.push(marker);

            if (markers.length > 50) {
                const oldMarker = markers.shift();
                map.removeLayer(oldMarker);
            }
        }

        function renderTopIps(topIps) {
            const tbody = document.getElementById("top-ips-body");
            if (!topIps || topIps.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="color:#868e96;">Aucune IP active sur la période</td></tr>`;
                return;
            }

            tbody.innerHTML = topIps.map(item => `
                <tr>
                    <td>
                        <div class="ip-cell">${escapeHtml(item.ip)}</div>
                        <div class="host-cell">${escapeHtml(item.hostname)}</div>
                    </td>
                    <td class="count-cell">${item.count}</td>
                </tr>
            `).join("");
        }

        function renderTopTargets(topTargets) {
            const tbody = document.getElementById("top-targets-body");
            if (!topTargets || topTargets.length === 0) return;

            tbody.innerHTML = topTargets.map(item => {
                const isHaproxy = String(item.target).startsWith("[haproxy]");
                const cellClass = isHaproxy ? "backend-cell" : "url-cell";
                return `
                    <tr>
                        <td class="${cellClass}">${escapeHtml(item.target)}</td>
                        <td class="count-cell">${item.count}</td>
                    </tr>
                `;
            }).join("");
        }

        function renderSources(sources) {
            if (!sources) return;
            document.getElementById("src-nginx").innerText = sources.nginx || 0;
            document.getElementById("src-haproxy").innerText = sources.haproxy || 0;
        }

        syncWindowSelect({{ window_seconds | default(3600) }});

        document.getElementById("window-select").addEventListener("change", async function(e) {
            const seconds = Number(e.target.value);
            const res = await fetch("/api/config", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ window_seconds: seconds })
            });
            if (res.ok) {
                const data = await res.json();
                syncWindowSelect(data.window_seconds);
            }
        });

        const evtSource = new EventSource("/stream");
        evtSource.onmessage = function(event) {
            const payload = JSON.parse(event.data);
            if (payload.window_seconds) {
                syncWindowSelect(payload.window_seconds);
            }
            if (payload.marker) {
                addMarker(payload.marker);
            }
            if (payload.top_ips) {
                renderTopIps(payload.top_ips);
            }
            if (payload.top_targets) {
                renderTopTargets(payload.top_targets);
            }
            if (payload.sources) {
                renderSources(payload.sources);
            }
        };
    </script>
</body>
</html>
