<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#14171a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GeoTracker">
    <link rel="manifest" href="/manifest.json">
    <title>Live IP Geolocation Tracker (Nginx + HAProxy)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #14171a;
            overflow: hidden;
        }
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }
        .panel {
            position: absolute;
            background: rgba(20, 23, 26, 0.93);
            backdrop-filter: blur(8px);
            color: #f1f3f5;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            z-index: 1000;
            font-size: 13px;
        }
        #info-panel {
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            width: 365px;
            max-height: calc(100% - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            overflow-y: auto;
            padding: 14px 16px;
        }
        #urls-panel {
            bottom: calc(12px + env(safe-area-inset-bottom));
            left: calc(12px + env(safe-area-inset-left));
            width: 420px;
            max-height: 42vh;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .toggle-btn {
            display: none;
            background: #2b3035;
            color: #f1f3f5;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 12px;
            cursor: pointer;
        }
        .install-btn {
            background: #2f9e44;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .install-btn:hover {
            background: #37b24d;
        }
        .top-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .total-box {
            font-size: 15px;
        }
        .sources-bar {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #ced4da;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .window-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 12px;
            color: #ced4da;
        }
        .window-row select {
            background: #2b3035;
            color: #f1f3f5;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
        }
        .dot-nginx { color: #ff7875; font-weight: 700; }
        .dot-haproxy { color: #51cf66; font-weight: 700; }
        h3 {
            margin: 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #adb5bd;
        }
        .panel-body {
            margin-top: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 5px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            vertical-align: top;
        }
        th {
            color: #868e96;
            font-weight: 600;
            font-size: 11px;
        }
        .ip-cell {
            font-family: monospace;
            color: #74c0fc;
        }
        .host-cell {
            color: #ced4da;
            font-size: 11px;
            word-break: break-all;
        }
        .url-cell {
            font-family: monospace;
            color: #ff8787;
            font-size: 12px;
            word-break: break-all;
        }
        .backend-cell {
            font-family: monospace;
            color: #51cf66;
            font-size: 12px;
            word-break: break-all;
        }
        .count-cell {
            text-align: right;
            font-weight: 700;
            color: #f1f3f5;
            white-space: nowrap;
            padding-left: 8px;
        }
        .ios-hint {
            display: none;
            font-size: 11px;
            color: #a5d8ff;
            background: rgba(116, 192, 252, 0.12);
            border: 1px solid rgba(116, 192, 252, 0.25);
            border-radius: 6px;
            padding: 7px 9px;
            margin-bottom: 10px;
            line-height: 1.35;
        }

        /* Mobile layout */
        @media (max-width: 768px) {
            .toggle-btn {
                display: inline-block;
            }
            #info-panel {
                top: calc(10px + env(safe-area-inset-top));
                left: calc(10px + env(safe-area-inset-left));
                right: calc(10px + env(safe-area-inset-right));
                width: auto;
                max-height: 55vh;
                padding: 10px 12px;
            }
            #info-panel.collapsed .collapsible {
                display: none;
            }
            #urls-panel {
                bottom: calc(10px + env(safe-area-inset-bottom));
                left: calc(10px + env(safe-area-inset-left));
                right: calc(10px + env(safe-area-inset-right));
                width: auto;
                max-height: 32vh;
                padding: 10px 12px;
            }
            #urls-panel.collapsed .panel-body {
                display: none;
            }
            .leaflet-control-zoom {
                margin-bottom: 64px !important;
            }
        }
    </style>
</head>
<body>
    <div id="info-panel" class="panel">
        <div class="top-actions">
            <div class="total-box">
                <b>Actives :</b> <span id="count">0</span>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
                <button id="install-btn" class="install-btn" style="display:none;">Installer l'app</button>
                <button id="toggle-info-btn" class="toggle-btn" type="button">Réduire</button>
            </div>
        </div>

        <div id="ios-hint" class="ios-hint">
            Sur iPhone/iPad (Safari) : touchez <b>Partager</b> puis <b>Sur l'écran d'accueil</b> pour installer l'application.
        </div>

        <div class="collapsible">
            <div class="sources-bar">
                <span><span class="dot-nginx">●</span> Nginx: <b id="src-nginx">0</b></span>
                <span><span class="dot-haproxy">●</span> HAProxy: <b id="src-haproxy">0</b></span>
            </div>
            <div class="window-row">
                <label for="ttl-select"><b>TTL actif :</b></label>
                <select id="ttl-select">
                    <option value="15">15s</option>
                    <option value="30">30s</option>
                    <option value="60" selected>60s</option>
                    <option value="120">2m</option>
                    <option value="300">5m</option>
                </select>
            </div>
            <div class="window-row">
                <label for="window-select"><b>Fenêtre Top 10 :</b></label>
                <select id="window-select">
                    <option value="900">15 min</option>
                    <option value="3600" selected>1 heure</option>
                    <option value="21600">6 heures</option>
                    <option value="86400">24 heures</option>
                </select>
            </div>
            <div class="panel-header">
                <h3>Top 10 IP (<span id="window-label">1h</span>)</h3>
            </div>
            <div class="panel-body">
                <table>
                    <thead>
                        <tr>
                            <th>IP / Hôte</th>
                            <th style="text-align: right;">Hits</th>
                        </tr>
                    </thead>
                    <tbody id="top-ips-body">
                        <tr><td colspan="2" style="color:#868e96;">En attente de trafic...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="urls-panel" class="panel">
        <div class="panel-header">
            <h3>Top 5 URL / Backends</h3>
            <button id="toggle-urls-btn" class="toggle-btn" type="button">Afficher</button>
        </div>
        <div class="panel-body">
            <table>
                <thead>
                    <tr>
                        <th>URL (Nginx) / Backend (HAProxy)</th>
                        <th style="text-align: right;">Hits</th>
                    </tr>
                </thead>
                <tbody id="top-targets-body">
                    <tr><td colspan="2" style="color:#868e96;">En attente de trafic...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const map = L.map("map", { worldCopyJump: true }).setView([20, 0], 2);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const BASE_RADIUS = 6;
        const MAX_SCALE_RATIO = 4;

        const NGINX_BRIGHT_STROKE = [255, 77, 79];
        const NGINX_LOW_STROKE    = [168, 85, 26];
        const NGINX_BRIGHT_FILL   = [255, 120, 117];
        const NGINX_LOW_FILL      = [204, 112, 41];

        const HAPROXY_BRIGHT_STROKE = [47, 158, 68];
        const HAPROXY_LOW_STROKE    = [74, 126, 199];
        const HAPROXY_BRIGHT_FILL   = [81, 207, 102];
        const HAPROXY_LOW_FILL      = [130, 185, 247];

        const activeEntriesByIp = new Map();
        let currentTtlSeconds = {{ active_ttl_seconds | default(60) }};

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function lerpColor(rgbA, rgbB, t) {
            const clamped = Math.max(0, Math.min(1, t));
            const r = Math.round(lerp(rgbA[0], rgbB[0], clamped));
            const g = Math.round(lerp(rgbA[1], rgbB[1], clamped));
            const b = Math.round(lerp(rgbA[2], rgbB[2], clamped));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function getFadeStyle(source, progress) {
            const p = Math.max(0, Math.min(1, progress));
            const isHaproxy = source === "haproxy";
            const strokeColor = isHaproxy
                ? lerpColor(HAPROXY_BRIGHT_STROKE, HAPROXY_LOW_STROKE, p)
                : lerpColor(NGINX_BRIGHT_STROKE, NGINX_LOW_STROKE, p);
            const fillColor = isHaproxy
                ? lerpColor(HAPROXY_BRIGHT_FILL, HAPROXY_LOW_FILL, p)
                : lerpColor(NGINX_BRIGHT_FILL, NGINX_LOW_FILL, p);

            return {
                color: strokeColor,
                fillColor: fillColor,
                fillOpacity: Number(lerp(0.85, 0.16, p).toFixed(3)),
                opacity: Number(lerp(0.95, 0.28, p).toFixed(3))
            };
        }

        function formatWindowLabel(sec) {
            const s = Number(sec) || 3600;
            if (s % 3600 === 0) return `${s / 3600}h`;
            if (s % 60 === 0) return `${s / 60}m`;
            return `${s}s`;
        }

        function ensureSelectValue(selectId, value) {
            const select = document.getElementById(selectId);
            const strVal = String(value);
            if (!Array.from(select.options).some(o => o.value === strVal)) {
                const opt = document.createElement("option");
                opt.value = strVal;
                opt.textContent = `${strVal}s`;
                select.appendChild(opt);
            }
            select.value = strVal;
        }

        function computeRadius(ipCount) {
            const hits = Math.max(1, Number(ipCount) || 1);
            const ratio = Math.min(MAX_SCALE_RATIO, 1 + Math.log2(hits) * 0.75);
            return BASE_RADIUS * ratio;
        }

        function buildPopupHtml(data, ipCount) {
            return (
                `<b>Source :</b> ${escapeHtml((data.source || "nginx").toUpperCase())}<br>` +
                `<b>IP :</b> ${escapeHtml(data.ip)} (${ipCount} hits actifs)<br>` +
                `<b>Hôte :</b> ${escapeHtml(data.hostname)}<br>` +
                `<b>Cible :</b> ${escapeHtml(data.target || "—")}<br>` +
                `<b>Lieu :</b> ${escapeHtml(data.city)}, ${escapeHtml(data.country)}`
            );
        }

        function removeIpMarker(ip) {
            const entry = activeEntriesByIp.get(ip);
            if (entry) {
                map.removeLayer(entry.layer);
                activeEntriesByIp.delete(ip);
            }
        }

        function updateMarkerFadeAndExpiry(nowMs) {
            const toRemove = [];
            for (const [ip, entry] of activeEntriesByIp.entries()) {
                const ttlMs = (entry.ttlSeconds || currentTtlSeconds) * 1000;
                const elapsedMs = Math.max(0, nowMs - entry.lastSeenClient);
                const progress = elapsedMs / ttlMs;

                if (progress >= 1) {
                    toRemove.push(ip);
                    continue;
                }
                entry.layer.setStyle(getFadeStyle(entry.meta.source, progress));
            }

            if (toRemove.length > 0) {
                for (const ip of toRemove) {
                    removeIpMarker(ip);
                }
                document.getElementById("count").innerText = activeEntriesByIp.size;
            }
        }

        function syncActiveMarkers(activeMarkers, expiredIps) {
            if (Array.isArray(expiredIps)) {
                for (const ip of expiredIps) {
                    removeIpMarker(ip);
                }
            }
            if (!Array.isArray(activeMarkers)) return;

            const currentIps = new Set(activeMarkers.map(m => m.ip));
            for (const ip of Array.from(activeEntriesByIp.keys())) {
                if (!currentIps.has(ip)) {
                    removeIpMarker(ip);
                }
            }

            const nowMs = performance.now();
            for (const data of activeMarkers) {
                const ipCount = data.ip_count || 1;
                const radius = computeRadius(ipCount);
                const ttlSec = Number(data.ttl_seconds) || currentTtlSeconds;
                const ageSec = Math.max(0, Number(data.age_seconds) || 0);
                const lastSeenClient = nowMs - Math.min(ageSec, ttlSec) * 1000;
                const style = getFadeStyle(data.source, Math.min(1, ageSec / ttlSec));
                const popupHtml = buildPopupHtml(data, ipCount);

                let entry = activeEntriesByIp.get(data.ip);
                if (entry) {
                    entry.meta = data;
                    entry.ttlSeconds = ttlSec;
                    entry.ipCount = ipCount;
                    entry.lastSeenClient = lastSeenClient;
                    entry.layer.setLatLng([data.lat, data.lon]);
                    entry.layer.setRadius(radius);
                    entry.layer.setStyle(style);
                    entry.layer.setPopupContent(popupHtml);
                } else {
                    const layer = L.circleMarker([data.lat, data.lon], {
                        radius: radius,
                        weight: 2,
                        ...style
                    }).addTo(map);
                    layer.bindPopup(popupHtml);
                    activeEntriesByIp.set(data.ip, {
                        layer,
                        meta: data,
                        ttlSeconds: ttlSec,
                        ipCount,
                        lastSeenClient
                    });
                }
            }
        }

        function renderTopIps(topIps) {
            const tbody = document.getElementById("top-ips-body");
            if (!topIps || topIps.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="color:#868e96;">Aucune IP active</td></tr>`;
                return;
            }
            tbody.innerHTML = topIps.map(item => `
                <tr>
                    <td>
                        <div class="ip-cell">${escapeHtml(item.ip)}</div>
                        <div class="host-cell">${escapeHtml(item.hostname)}</div>
                    </td>
                    <td class="count-cell">${item.count}</td>
                </tr>
            `).join("");
        }

        function renderTopTargets(topTargets) {
            const tbody = document.getElementById("top-targets-body");
            if (!topTargets || topTargets.length === 0) return;
            tbody.innerHTML = topTargets.map(item => {
                const isHaproxy = String(item.target).startsWith("[haproxy]");
                const cellClass = isHaproxy ? "backend-cell" : "url-cell";
                return `
                    <tr>
                        <td class="${cellClass}">${escapeHtml(item.target)}</td>
                        <td class="count-cell">${item.count}</td>
                    </tr>
                `;
            }).join("");
        }

        function renderSources(sources) {
            if (!sources) return;
            document.getElementById("src-nginx").innerText = sources.nginx || 0;
            document.getElementById("src-haproxy").innerText = sources.haproxy || 0;
        }

        async function pushConfigUpdate() {
            const seconds = Number(document.getElementById("window-select").value);
            const ttl = Number(document.getElementById("ttl-select").value);
            const res = await fetch("/api/config", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    window_seconds: seconds,
                    active_ttl_seconds: ttl
                })
            });
            if (res.ok) {
                const data = await res.json();
                currentTtlSeconds = Number(data.active_ttl_seconds) || currentTtlSeconds;
                ensureSelectValue("window-select", data.window_seconds);
                ensureSelectValue("ttl-select", data.active_ttl_seconds);
                document.getElementById("window-label").innerText = formatWindowLabel(data.window_seconds);
            }
        }

        // Mobile panel collapse toggles
        const infoPanel = document.getElementById("info-panel");
        const urlsPanel = document.getElementById("urls-panel");
        const toggleInfoBtn = document.getElementById("toggle-info-btn");
        const toggleUrlsBtn = document.getElementById("toggle-urls-btn");

        if (window.innerWidth <= 768) {
            infoPanel.classList.add("collapsed");
            urlsPanel.classList.add("collapsed");
            toggleInfoBtn.innerText = "Infos";
            toggleUrlsBtn.innerText = "Top 5";
        }

        toggleInfoBtn.addEventListener("click", () => {
            const collapsed = infoPanel.classList.toggle("collapsed");
            toggleInfoBtn.innerText = collapsed ? "Infos" : "Réduire";
        });

        toggleUrlsBtn.addEventListener("click", () => {
            const collapsed = urlsPanel.classList.toggle("collapsed");
            toggleUrlsBtn.innerText = collapsed ? "Top 5" : "Réduire";
        });

        // PWA Install prompt handling
        let deferredPrompt = null;
        const installBtn = document.getElementById("install-btn");
        const iosHint = document.getElementById("ios-hint");
        const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
        const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);

        if (!isStandalone && isIos) {
            iosHint.style.display = "block";
        }

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!isStandalone) {
                installBtn.style.display = "inline-block";
            }
        });

        installBtn.addEventListener("click", async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.style.display = "none";
        });

        window.addEventListener("appinstalled", () => {
            installBtn.style.display = "none";
            iosHint.style.display = "none";
        });

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js").catch(() => {});
            });
        }

        ensureSelectValue("window-select", {{ window_seconds | default(3600) }});
        ensureSelectValue("ttl-select", {{ active_ttl_seconds | default(60) }});
        document.getElementById("window-label").innerText = formatWindowLabel({{ window_seconds | default(3600) }});

        document.getElementById("window-select").addEventListener("change", pushConfigUpdate);
        document.getElementById("ttl-select").addEventListener("change", pushConfigUpdate);

        setInterval(() => {
            updateMarkerFadeAndExpiry(performance.now());
        }, 500);

        const evtSource = new EventSource("/stream");
        evtSource.onmessage = function(event) {
            const payload = JSON.parse(event.data);
            if (payload.window_seconds) {
                ensureSelectValue("window-select", payload.window_seconds);
                document.getElementById("window-label").innerText = formatWindowLabel(payload.window_seconds);
            }
            if (payload.active_ttl_seconds) {
                currentTtlSeconds = Number(payload.active_ttl_seconds);
                ensureSelectValue("ttl-select", payload.active_ttl_seconds);
            }
            if (typeof payload.active_connections === "number") {
                document.getElementById("count").innerText = payload.active_connections;
            }
            syncActiveMarkers(payload.active_markers, payload.expired_ips);
            if (payload.top_ips) {
                renderTopIps(payload.top_ips);
            }
            if (payload.top_targets) {
                renderTopTargets(payload.top_targets);
            }
            if (payload.sources) {
                renderSources(payload.sources);
            }
        };
    </script>
</body>
</html>
